name: Apply Access Policy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Access policy mode. Report is non-mutating; apply enforces teams, org roles, and repo grants.
        required: true
        default: report
        type: choice
        options:
          - report
          - apply
  schedule:
    - cron: "41 * * * *"
  pull_request:
    paths:
      - "policies/access/**"
      - "scripts/sync-access-policy.py"
      - ".github/workflows/apply-access-policy.yml"
  push:
    branches:
      - main
    paths:
      - "policies/access/**"
      - "scripts/sync-access-policy.py"
      - ".github/workflows/apply-access-policy.yml"

permissions:
  contents: read

jobs:
  report:
    if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'report') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Report access policy
        run: python3 scripts/sync-access-policy.py --mode report

  apply:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply') }}
    runs-on: ubuntu-latest
    environment: org-policy
    concurrency:
      group: apply-access-policy
      cancel-in-progress: false
    env:
      ORG_NAME: sima-neat
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate GitHub App configuration
        env:
          APP_CLIENT_ID: ${{ vars.ACCESS_POLICY_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ACCESS_POLICY_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "${APP_CLIENT_ID}" || -z "${APP_PRIVATE_KEY}" ]]; then
            echo "Set ACCESS_POLICY_APP_CLIENT_ID (variable) and ACCESS_POLICY_APP_PRIVATE_KEY (secret) in environment org-policy."
            echo "See policies/access/README.md for GitHub App setup."
            exit 1
          fi

      - name: Create access policy installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.ACCESS_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACCESS_POLICY_APP_PRIVATE_KEY }}
          # An explicit owner and no repository list covers the installation.
          owner: ${{ env.ORG_NAME }}
          permission-administration: write
          permission-members: write
          permission-organization-custom-org-roles: read

      - name: Record automation identity
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        run: echo "Applying as GitHub App ${APP_SLUG} (installation ${INSTALLATION_ID})"

      - name: Apply access policy
        env:
          ORG_ADMIN_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 scripts/sync-access-policy.py --mode apply
