name: Enforce Org Rulesets

on:
  pull_request:
    paths:
      - "policies/org-rulesets/**"
      - "policies/access/config.json"
      - "scripts/sync-org-rulesets.sh"
      - "scripts/org-ruleset-matches.jq"
      - "tests/test_org_rulesets.py"
      - ".github/workflows/enforce-org-rulesets.yml"
  workflow_dispatch:
  schedule:
    - cron: "22 * * * *"
  push:
    branches:
      - main
    paths:
      - "policies/org-rulesets/**"
      - "scripts/sync-org-rulesets.sh"
      - "scripts/org-ruleset-matches.jq"
      - "tests/test_org_rulesets.py"
      - "policies/access/config.json"
      - ".github/workflows/enforce-org-rulesets.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Check shell syntax and lint
        run: |
          bash -n scripts/sync-org-rulesets.sh
          shellcheck scripts/sync-org-rulesets.sh
      - name: Test policy rendering, migration and verification
        run: python3 -m unittest discover -s tests -p test_org_rulesets.py

  sync:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    concurrency:
      group: enforce-org-rulesets
      cancel-in-progress: false
    environment: org-policy
    env:
      ORG_NAME: sima-neat
      ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secret
        run: |
          if [[ -z "${ORG_ADMIN_TOKEN}" ]]; then
            echo "Missing secret. Set ORG_ADMIN_TOKEN in environment org-policy."
            echo "Token must be allowed to administer organizations in this org."
            exit 1
          fi

      - name: Sync org rulesets
        run: ./scripts/sync-org-rulesets.sh
