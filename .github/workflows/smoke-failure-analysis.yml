name: Smoke test failure analysis on bridges

# Persistent runners execute only a revision accepted onto protected main.
# Do not add pull_request, pull_request_target, or arbitrary-ref dispatch triggers.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*failure-analysis*'
      - 'scripts/failure_analysis.py'
      - 'schemas/failure-analysis.schema.json'
permissions:
  contents: read
jobs:
  bridge-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bridge
            labels: '["self-hosted", "bridge"]'
          - target: bridge-mirror
            labels: '["self-hosted", "apt-mirror"]'
    runs-on: ${{ fromJSON(matrix.labels) }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify Python
        run: python3 --version
      - name: Check live API smoke configuration
        id: credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Live API smoke not run: configure OPENAI_API_KEY in the shared repository."
          fi
      - name: Diagnose synthetic docs failure without Slack
        if: steps.credential.outputs.configured == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('evidence/context.json').write_text(json.dumps({
              'repository': 'sima-neat/core', 'run_id': 1, 'run_attempt': 1,
              'jobs': [{'name': 'Build docs', 'conclusion': 'failure',
                        'log': 'Error: duplicate sidebar category key peripherals'}],
              'limitations': ['Synthetic smoke fixture, not a real workflow failure.']
          }))
          PY
          python3 scripts/failure_analysis.py analyze --directory evidence
      - uses: actions/upload-artifact@v6
        if: steps.credential.outputs.configured == 'true'
        with:
          name: bridge-analysis-smoke-${{ matrix.target }}
          path: evidence/analysis.json
          if-no-files-found: error
      - if: always()
        run: rm -rf evidence
