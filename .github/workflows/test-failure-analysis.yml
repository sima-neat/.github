name: Test failure analysis
on:
  pull_request:
    paths:
      - '.github/workflows/*failure-analysis*'
      - '.github/workflows/vulcan-notify-slack.yml'
      - 'scripts/failure_analysis.py'
      - 'schemas/failure-analysis.schema.json'
      - 'tests/test_failure_analysis.py'
      - 'tests/test_vulcan_slack_notification.py'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q tests/test_failure_analysis.py tests/test_vulcan_slack_notification.py
  bridge-smoke:
    # Never execute fork PR code on private runners.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bridge]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Verify bridge tools and authentication
        run: |
          python3 --version
          codex --version
          codex login status
      - name: Diagnose synthetic docs failure without Slack
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('evidence/context.json').write_text(json.dumps({
              'repository': 'sima-neat/core', 'run_id': 1, 'run_attempt': 1,
              'jobs': [{'name': 'Build docs', 'conclusion': 'failure',
                        'log': 'Error: duplicate sidebar category key peripherals'}],
              'limitations': ['Synthetic smoke fixture, not a real workflow failure.']
          }))
          PY
          python3 scripts/failure_analysis.py analyze --directory evidence
      - uses: actions/upload-artifact@v6
        with:
          name: bridge-analysis-smoke
          path: evidence/analysis.json
          if-no-files-found: error
      - if: always()
        run: rm -rf evidence
