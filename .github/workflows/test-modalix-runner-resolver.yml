name: Test Modalix Runner Resolver
on:
  push:
    paths:
      - policies/platform-build-compatibility.json
      - scripts/resolve_modalix_runner.py
      - scripts/bundle_modalix_resolver.py
      - tests/test_resolve_modalix_runner.py
      - tests/test_resolve_sysroot.py
      - .github/workflows/vulcan-resolve-modalix-runner.yml
      - .github/workflows/test-modalix-runner-resolver.yml
  pull_request:
    paths:
      - policies/platform-build-compatibility.json
      - scripts/resolve_modalix_runner.py
      - scripts/bundle_modalix_resolver.py
      - tests/test_resolve_modalix_runner.py
      - tests/test_resolve_sysroot.py
      - .github/workflows/vulcan-resolve-modalix-runner.yml
      - .github/workflows/test-modalix-runner-resolver.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python scripts/bundle_modalix_resolver.py --check
      - run: python -m pytest tests/test_resolve_modalix_runner.py tests/test_resolve_sysroot.py -q
  legacy-call:
    uses: ./.github/workflows/vulcan-resolve-modalix-runner.yml
    with:
      manifest_path: tests/fixtures/legacy-runner-manifest.json
  verify-legacy:
    needs: legacy-call
    runs-on: ubuntu-latest
    steps:
      - name: Verify unchanged group without credentials
        env:
          GROUP: ${{ needs.legacy-call.outputs.modalix_runner_group }}
          PLATFORM: ${{ needs.legacy-call.outputs.platform_version }}
          FIRMWARE: ${{ needs.legacy-call.outputs.elxr_version }}
        run: |
          test "$GROUP" = modalix-devkit-3.0.0
          test "$PLATFORM" = 3.0.0
          test -z "$FIRMWARE"

  stage-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-manifest
          path: tests/fixtures/legacy-runner-manifest.json
  artifact-call:
    needs: [stage-manifest, legacy-call]
    uses: ./.github/workflows/vulcan-resolve-modalix-runner.yml
    with:
      manifest_artifact: dependency-manifest
      manifest_path: legacy-runner-manifest.json
      shared_workflow_ref: ${{ github.event.pull_request.head.sha || github.sha }}
  verify-artifact:
    needs: artifact-call
    runs-on: ubuntu-latest
    steps:
      - name: Verify downloaded manifest selected the runner group
        env:
          GROUP: ${{ needs.artifact-call.outputs.modalix_runner_group }}
          PLATFORM: ${{ needs.artifact-call.outputs.platform_version }}
        run: |
          test "$GROUP" = modalix-devkit-3.0.0
          test "$PLATFORM" = 3.0.0
