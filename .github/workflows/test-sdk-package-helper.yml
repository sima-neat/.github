name: Test SDK package helper
on:
  pull_request:
    paths:
      - scripts/sdk-package.sh
      - scripts/bundle_sdk_package_helper.py
      - actions/setup-sdk-package-helper/**
      - tests/test_sdk_package.py
      - tests/sdk_package_integration.py
      - .github/workflows/vulcan-build.yml
      - .github/workflows/test-sdk-package-helper.yml
  push:
    branches: [main]
    paths:
      - scripts/sdk-package.sh
      - scripts/bundle_sdk_package_helper.py
      - actions/setup-sdk-package-helper/**
      - tests/test_sdk_package.py
      - tests/sdk_package_integration.py
      - .github/workflows/vulcan-build.yml
      - .github/workflows/test-sdk-package-helper.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests -p test_sdk_package.py -v
      - run: shellcheck scripts/sdk-package.sh
      - uses: ./actions/setup-sdk-package-helper
      - run: test -x "$SDK_PACKAGE_HELPER"
      - name: Real package-lock contention in disposable Debian container
        run: python3 tests/sdk_package_integration.py --image python:3.12-slim
