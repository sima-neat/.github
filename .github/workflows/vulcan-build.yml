name: vulcan-build

on:
  workflow_call:
    secrets:
      checkout_token:
        description: Optional token with read access to the caller repository and its private submodules.
        required: false
      checkout_ssh_key:
        description: Optional read-only SSH key used to initialize private submodules after checkout.
        required: false
    inputs:
      vulcan_env:
        description: Vulcan environment label override. Empty uses the caller repo or org VULCAN_ENV variable, then dev.
        required: false
        default: ""
        type: string
      sdk_cache:
        description: Vulcan SDK cache label, such as sdk-latest or sdk-2.1.
        required: false
        default: sdk-latest
        type: string
      runner_profile:
        description: Vulcan runner profile. Defaults to the current SDK runner behavior.
        required: false
        default: sdk
        type: string
      architecture:
        description: Vulcan runner architecture label.
        required: false
        default: arm64
        type: string
      cache:
        description: Optional generic cache label. For sdk this overrides sdk_cache; for ros2 or model-compiler this selects that profile's cache.
        required: false
        default: ""
        type: string
      capacity:
        description: "Vulcan capacity label: cheaper, cheap, default, expensive, or most-expensive."
        required: false
        default: default
        type: string
      working_directory:
        description: Directory under the checked-out repository where the build command runs.
        required: false
        default: "."
        type: string
      build_command:
        description: Build command to run inside the checked-out repository.
        required: false
        default: "./build.sh --all --clean"
        type: string
      pre_build_command:
        description: Optional shell command to run before build_command.
        required: false
        default: ""
        type: string
      post_build_command:
        description: Optional shell command to run after build_command.
        required: false
        default: ""
        type: string
      ensure_sdk_container:
        description: Run sima-cli sdk setup before the build.
        required: false
        default: true
        type: boolean
      ensure_ros2_container:
        description: Start the cached ROS2 SDK container and run build commands inside it.
        required: false
        default: true
        type: boolean
      ros2_image:
        description: ROS2 SDK image that must already exist in the selected Vulcan snapshot.
        required: false
        default: ghcr.io/sima-vertical-solutions/ros2-sdk:latest
        type: string
      sdk_setup_args:
        description: Arguments for sima-cli sdk setup when ensure_sdk_container is true.
        required: false
        default: "-y -n --minimal --workspace /mnt/vulcan/workspace --no-model-sdk --no-insight"
        type: string
      fetch_depth:
        description: Git checkout fetch depth. Use 0 when versioning depends on tags/history.
        required: false
        default: 1
        type: number
      checkout_submodules:
        description: Whether actions/checkout should fetch submodules.
        required: false
        default: recursive
        type: string
      artifact_name:
        description: Optional GitHub Actions artifact name to upload after build_command.
        required: false
        default: ""
        type: string
      artifact_path:
        description: Optional path or glob to upload after build_command.
        required: false
        default: ""
        type: string
      artifact_retention_days:
        description: Retention days for uploaded GitHub Actions artifacts.
        required: false
        default: 7
        type: number
      use_github_environment:
        description: Attach the build job to the Vulcan GitHub Environment. Disable only when ref-bound OIDC credentials are required.
        required: false
        default: true
        type: boolean
      compiler_cache_bucket:
        description: Optional private compiler-cache S3 bucket.
        required: false
        default: ""
        type: string
      compiler_cache_aws_region:
        description: AWS region containing the compiler cache.
        required: false
        default: us-west-2
        type: string
      compiler_cache_key_prefix:
        description: Top-level S3 key prefix reserved for compiler cache objects.
        required: false
        default: ""
        type: string
      compiler_cache_seed_key_prefix:
        description: Optional read-only S3 prefix copied into an empty branch cache before the build.
        required: false
        default: ""
        type: string
      compiler_cache_role_arn:
        description: Optional GitHub OIDC role for compiler-cache access.
        required: false
        default: ""
        type: string
      compiler_cache_rw_mode:
        description: Compiler-cache S3 mode, READ_ONLY or READ_WRITE.
        required: false
        default: READ_ONLY
        type: string

permissions:
  contents: read
  id-token: write
  packages: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  VULCAN_ENV: ${{ inputs.vulcan_env || vars.VULCAN_ENV || 'dev' }}
  VULCAN_RUNNER_PROFILE: ${{ inputs.runner_profile }}
  VULCAN_ARCHITECTURE: ${{ inputs.architecture }}
  VULCAN_CACHE: ${{ inputs.cache || inputs.sdk_cache }}
  SDK_CACHE: ${{ inputs.cache || inputs.sdk_cache }}
  VULCAN_CAPACITY: ${{ inputs.capacity }}
  VULCAN_WORKSPACE: /mnt/vulcan/workspace
  MODEL_COMPILER_CACHE_ROOT: /mnt/model-compiler

jobs:
  resolve-runner:
    name: Resolve Vulcan runner labels
    runs-on: ubuntu-latest
    outputs:
      labels: ${{ steps.resolve.outputs.labels }}
      profile: ${{ steps.resolve.outputs.profile }}
      architecture: ${{ steps.resolve.outputs.architecture }}
      cache: ${{ steps.resolve.outputs.cache }}

    steps:
      - name: Resolve labels
        id: resolve
        shell: bash
        env:
          VULCAN_ENV: ${{ inputs.vulcan_env || vars.VULCAN_ENV || 'dev' }}
          RUNNER_PROFILE: ${{ inputs.runner_profile }}
          ARCHITECTURE: ${{ inputs.architecture }}
          CAPACITY: ${{ inputs.capacity }}
          SDK_CACHE: ${{ inputs.sdk_cache }}
          CACHE: ${{ inputs.cache }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          profile = os.environ["RUNNER_PROFILE"].strip().lower()
          architecture = os.environ["ARCHITECTURE"].strip().lower()
          capacity = os.environ["CAPACITY"].strip().lower()
          vulcan_env = os.environ["VULCAN_ENV"].strip().lower()
          sdk_cache = os.environ["SDK_CACHE"].strip().lower()
          cache = os.environ["CACHE"].strip().lower()

          allowed_profiles = {"sdk", "ros2", "ubuntu", "model-compiler"}
          allowed_architectures = {"arm64", "amd64"}
          label_pattern = re.compile(r"[a-z0-9][a-z0-9._-]*")
          if profile not in allowed_profiles:
              print(f"Unsupported runner_profile: {profile}", file=sys.stderr)
              sys.exit(1)
          if architecture not in allowed_architectures:
              print(f"Unsupported architecture: {architecture}", file=sys.stderr)
              sys.exit(1)
          if not label_pattern.fullmatch(capacity):
              print(f"Unsupported capacity label: {capacity}", file=sys.stderr)
              sys.exit(1)
          for name, value in (("sdk_cache", sdk_cache), ("cache", cache)):
              if value and not label_pattern.fullmatch(value):
                  print(f"Unsupported {name} label: {value}", file=sys.stderr)
                  sys.exit(1)

          effective_cache = cache
          if profile == "sdk":
              effective_cache = cache or sdk_cache
              if not effective_cache:
                  print("SDK profile requires a cache label.", file=sys.stderr)
                  sys.exit(1)
              # Keep the SDK profile's default labels exactly compatible with
              # existing Vulcan scaler behavior. The scaler can later map this
              # legacy label set into the internal sdk profile without forcing
              # every existing caller to update at once.
              labels = [
                  "self-hosted",
                  "linux",
                  architecture,
                  f"vulcan-{vulcan_env}",
                  "sdk-build",
                  effective_cache,
                  capacity,
              ]
          elif profile == "ros2":
              effective_cache = cache or "ros2-latest"
              if not effective_cache.startswith("ros2-"):
                  print("ROS2 profile requires a ros2-* cache label.", file=sys.stderr)
                  sys.exit(1)
              if architecture != "arm64":
                  print("ROS2 profile currently supports only arm64.", file=sys.stderr)
                  sys.exit(1)
              labels = [
                  "self-hosted",
                  "linux",
                  architecture,
                  f"vulcan-{vulcan_env}",
                  "ros2",
                  effective_cache,
                  capacity,
              ]
          elif profile == "model-compiler":
              labels = [
                  "self-hosted",
                  "linux",
                  architecture,
                  f"vulcan-{vulcan_env}",
                  "model-compiler",
                  capacity,
              ]
              if effective_cache:
                  labels.append(effective_cache)
          else:
              labels = [
                  "self-hosted",
                  "linux",
                  architecture,
                  f"vulcan-{vulcan_env}",
                  "ubuntu",
                  capacity,
              ]

          github_output = os.environ["GITHUB_OUTPUT"]
          with open(github_output, "a", encoding="utf-8") as out:
              out.write(f"labels={json.dumps(labels, separators=(',', ':'))}\n")
              out.write(f"profile={profile}\n")
              out.write(f"architecture={architecture}\n")
              out.write(f"cache={effective_cache}\n")
          PY

  build:
    name: Build on Vulcan
    needs: resolve-runner
    environment: ${{ inputs.use_github_environment && (inputs.vulcan_env || vars.VULCAN_ENV || 'dev') || '' }}
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.labels) }}
    env:
      VULCAN_RUNNER_PROFILE: ${{ needs.resolve-runner.outputs.profile }}
      VULCAN_ARCHITECTURE: ${{ needs.resolve-runner.outputs.architecture }}
      VULCAN_CACHE: ${{ needs.resolve-runner.outputs.cache }}
      SDK_CACHE: ${{ needs.resolve-runner.outputs.cache }}

    steps:
      - name: Validate compiler cache configuration
        if: ${{ inputs.compiler_cache_role_arn != '' }}
        shell: bash
        env:
          COMPILER_CACHE_BUCKET: ${{ inputs.compiler_cache_bucket }}
          COMPILER_CACHE_REGION: ${{ inputs.compiler_cache_aws_region }}
          COMPILER_CACHE_KEY_PREFIX: ${{ inputs.compiler_cache_key_prefix }}
          COMPILER_CACHE_RW_MODE: ${{ inputs.compiler_cache_rw_mode }}
        run: |
          set -euo pipefail
          test -n "${COMPILER_CACHE_BUCKET}"
          test -n "${COMPILER_CACHE_REGION}"
          test -n "${COMPILER_CACHE_KEY_PREFIX}"
          case "${COMPILER_CACHE_RW_MODE}" in
            READ_ONLY|READ_WRITE) ;;
            *)
              echo "Unsupported compiler_cache_rw_mode: ${COMPILER_CACHE_RW_MODE}" >&2
              exit 1
              ;;
          esac

          {
            printf 'SCCACHE_BUCKET=%s\n' "${COMPILER_CACHE_BUCKET}"
            printf 'SCCACHE_REGION=%s\n' "${COMPILER_CACHE_REGION}"
            printf 'SCCACHE_S3_KEY_PREFIX=%s\n' "${COMPILER_CACHE_KEY_PREFIX}"
            printf 'SCCACHE_S3_RW_MODE=%s\n' "${COMPILER_CACHE_RW_MODE}"
          } >> "${GITHUB_ENV}"

      - name: Configure compiler cache AWS credentials
        if: ${{ inputs.compiler_cache_role_arn != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.compiler_cache_aws_region }}
          role-to-assume: ${{ inputs.compiler_cache_role_arn }}
          role-session-name: vulcan-compiler-cache-${{ github.run_id }}

      - name: Seed branch compiler cache
        if: ${{ inputs.compiler_cache_role_arn != '' && inputs.compiler_cache_seed_key_prefix != '' && inputs.compiler_cache_seed_key_prefix != inputs.compiler_cache_key_prefix }}
        shell: bash
        env:
          SCCACHE_SEED_KEY_PREFIX: ${{ inputs.compiler_cache_seed_key_prefix }}
        run: |
          set -euo pipefail

          marker_key="${SCCACHE_S3_KEY_PREFIX}/.sima-neat-seed.json"
          if aws s3api head-object --bucket "${SCCACHE_BUCKET}" --key "${marker_key}" >/dev/null 2>&1; then
            echo "Branch compiler cache is already seeded."
            exit 0
          fi

          echo "Seeding s3://${SCCACHE_BUCKET}/${SCCACHE_S3_KEY_PREFIX}/ from shared cache."
          aws s3 sync \
            "s3://${SCCACHE_BUCKET}/${SCCACHE_SEED_KEY_PREFIX}/" \
            "s3://${SCCACHE_BUCKET}/${SCCACHE_S3_KEY_PREFIX}/" \
            --exclude "branches/*" \
            --only-show-errors

          marker_file="$(mktemp)"
          trap 'rm -f "${marker_file}"' EXIT
          python3 - "${marker_file}" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as out:
              json.dump(
                  {
                      "repository": os.environ["GITHUB_REPOSITORY"],
                      "ref": os.environ["GITHUB_REF"],
                      "seed_prefix": os.environ["SCCACHE_SEED_KEY_PREFIX"],
                      "run_id": os.environ["GITHUB_RUN_ID"],
                  },
                  out,
                  sort_keys=True,
              )
              out.write("\n")
          PY
          aws s3api put-object \
            --bucket "${SCCACHE_BUCKET}" \
            --key "${marker_key}" \
            --body "${marker_file}" >/dev/null

      - name: Prepare Vulcan workspace
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0775 "${VULCAN_WORKSPACE}"
          find "${VULCAN_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.fetch_depth }}
          submodules: ${{ inputs.checkout_submodules }}
          token: ${{ secrets.checkout_token || github.token }}

      - name: Initialize private submodules
        shell: bash
        env:
          CHECKOUT_SSH_KEY: ${{ secrets.checkout_ssh_key }}
        run: |
          set -euo pipefail
          if [[ -z "${CHECKOUT_SSH_KEY}" ]]; then
            echo "No private-submodule SSH key was provided."
            exit 0
          fi
          key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          cleanup() {
            rm -f "${key_file}" "${known_hosts_file}"
          }
          trap cleanup EXIT
          chmod 0600 "${key_file}"
          printf '%s\n' "${CHECKOUT_SSH_KEY}" > "${key_file}"
          ssh-keyscan -t ed25519 github.com > "${known_hosts_file}" 2>/dev/null
          git submodule sync --recursive
          git \
            -c core.sshCommand="ssh -i ${key_file} -o IdentitiesOnly=yes -o UserKnownHostsFile=${known_hosts_file} -o StrictHostKeyChecking=yes" \
            submodule update --init --recursive

      - name: Stage checkout into Vulcan workspace
        shell: bash
        run: |
          set -euo pipefail
          find "${VULCAN_WORKSPACE}" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          tar -C "${GITHUB_WORKSPACE}" --exclude .git -cf - . | tar -C "${VULCAN_WORKSPACE}" -xf -
          test -f "${VULCAN_WORKSPACE}/README.md"

      - name: Inspect Vulcan runner
        shell: bash
        run: |
          set -euo pipefail
          echo "VULCAN_ENV=${VULCAN_ENV}"
          echo "VULCAN_RUNNER_PROFILE=${VULCAN_RUNNER_PROFILE}"
          echo "VULCAN_ARCHITECTURE=${VULCAN_ARCHITECTURE}"
          echo "VULCAN_CACHE=${VULCAN_CACHE}"
          echo "SDK_CACHE=${SDK_CACHE}"
          echo "VULCAN_CAPACITY=${VULCAN_CAPACITY}"
          uname -a
          id
          df -h
          if [[ "${VULCAN_RUNNER_PROFILE}" != "sdk" && "${VULCAN_RUNNER_PROFILE}" != "ros2" ]] && ! docker info >/dev/null 2>&1; then
            echo "Docker daemon is unavailable; it is optional for the ${VULCAN_RUNNER_PROFILE} runner profile."
          else
            docker version
            docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          fi
          if [[ "${VULCAN_RUNNER_PROFILE}" == "sdk" ]]; then
            test -x /mnt/vulcan/bin/sima-cli
            /mnt/vulcan/bin/sima-cli --version || /mnt/vulcan/bin/sima-cli version
          fi

      - name: Configure Model Compiler environment
        if: ${{ needs.resolve-runner.outputs.profile == 'model-compiler' }}
        shell: bash
        run: |
          set -euo pipefail
          venv="${MODEL_COMPILER_CACHE_ROOT}"
          if [[ ! -f "${venv}/bin/activate" ]]; then
            echo "Model Compiler virtual environment was not found at ${venv}." >&2
            exit 1
          fi
          echo "VIRTUAL_ENV=${venv}" >> "${GITHUB_ENV}"
          echo "${venv}/bin" >> "${GITHUB_PATH}"
          "${venv}/bin/python" - <<'PY'
          import sys
          print(sys.executable)
          PY

      - name: Ensure SDK container
        if: ${{ needs.resolve-runner.outputs.profile == 'sdk' && inputs.ensure_sdk_container }}
        shell: bash
        env:
          SDK_SETUP_ARGS: ${{ inputs.sdk_setup_args }}
        run: |
          set -euo pipefail
          cd "${VULCAN_WORKSPACE}"
          read -r -a sdk_setup_argv <<< "${SDK_SETUP_ARGS}"
          /mnt/vulcan/bin/sima-cli sdk setup "${sdk_setup_argv[@]}"
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'

      - name: Start ROS2 SDK container
        if: ${{ needs.resolve-runner.outputs.profile == 'ros2' && inputs.ensure_ros2_container }}
        shell: bash
        env:
          ROS2_IMAGE: ${{ inputs.ros2_image }}
          ROS2_WORKING_DIRECTORY: ${{ inputs.working_directory }}
        run: |
          set -euo pipefail
          container_name="vulcan-ros2-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "${ROS2_WORKING_DIRECTORY}" == /* || "/${ROS2_WORKING_DIRECTORY}/" == *"/../"* ]]; then
            echo "ROS2 working_directory must stay within the checkout: ${ROS2_WORKING_DIRECTORY}" >&2
            exit 1
          fi
          relative_workdir="${ROS2_WORKING_DIRECTORY#./}"
          container_workdir="/workspace"
          if [[ -n "${relative_workdir}" && "${relative_workdir}" != "." ]]; then
            container_workdir="${container_workdir}/${relative_workdir}"
          fi
          docker image inspect "${ROS2_IMAGE}" >/dev/null
          test "$(docker image inspect --format '{{.Architecture}}' "${ROS2_IMAGE}")" = arm64
          docker run \
            --detach \
            --name "${container_name}" \
            --pull never \
            --user root \
            --env HOME=/root \
            --volume "${VULCAN_WORKSPACE}:/workspace" \
            --workdir /workspace \
            --entrypoint sleep \
            "${ROS2_IMAGE}" infinity >/dev/null
          echo "ROS2_CONTAINER=${container_name}" >> "${GITHUB_ENV}"
          echo "ROS2_CONTAINER_WORKDIR=${container_workdir}" >> "${GITHUB_ENV}"
          docker exec "${container_name}" test -r /etc/sdk-release
          docker exec "${container_name}" cat /etc/sdk-release

      - name: Pre-build
        if: ${{ inputs.pre_build_command != '' }}
        shell: bash
        working-directory: ${{ env.VULCAN_WORKSPACE }}/${{ inputs.working_directory }}
        env:
          PRE_BUILD_COMMAND: ${{ inputs.pre_build_command }}
        run: |
          set -euo pipefail
          if [[ -n "${ROS2_CONTAINER:-}" ]]; then
            docker exec --workdir "${ROS2_CONTAINER_WORKDIR}" "${ROS2_CONTAINER}" bash -lc "${PRE_BUILD_COMMAND}"
          else
            bash -lc "${PRE_BUILD_COMMAND}"
          fi

      - name: Build
        shell: bash
        working-directory: ${{ env.VULCAN_WORKSPACE }}/${{ inputs.working_directory }}
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          if [[ -n "${ROS2_CONTAINER:-}" ]]; then
            docker exec --workdir "${ROS2_CONTAINER_WORKDIR}" "${ROS2_CONTAINER}" bash -lc "${BUILD_COMMAND}"
          else
            bash -lc "${BUILD_COMMAND}"
          fi

      - name: Post-build
        if: ${{ inputs.post_build_command != '' }}
        shell: bash
        working-directory: ${{ env.VULCAN_WORKSPACE }}/${{ inputs.working_directory }}
        env:
          POST_BUILD_COMMAND: ${{ inputs.post_build_command }}
        run: |
          set -euo pipefail
          if [[ -n "${ROS2_CONTAINER:-}" ]]; then
            docker exec --workdir "${ROS2_CONTAINER_WORKDIR}" "${ROS2_CONTAINER}" bash -lc "${POST_BUILD_COMMAND}"
          else
            bash -lc "${POST_BUILD_COMMAND}"
          fi

      - name: Stop ROS2 SDK container
        if: ${{ always() && needs.resolve-runner.outputs.profile == 'ros2' && inputs.ensure_ros2_container }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ROS2_CONTAINER:-}" ]]; then
            docker rm --force "${ROS2_CONTAINER}"
          fi

      - name: Upload build artifact
        if: ${{ inputs.artifact_name != '' && inputs.artifact_path != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ env.VULCAN_WORKSPACE }}/${{ inputs.artifact_path }}
          if-no-files-found: error
          retention-days: ${{ inputs.artifact_retention_days }}
