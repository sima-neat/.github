name: vulcan-notify-slack

on:
  workflow_call:
    inputs:
      analyze_failure:
        description: Append automated diagnosis in a Slack thread.
        type: boolean
        default: false
      channel_id:
        description: Slack channel ID that receives the notification.
        required: true
        type: string
      run_id:
        description: GitHub Actions workflow run ID to inspect.
        required: true
        type: number
      repository:
        description: Caller repository in owner/name form.
        required: true
        type: string
      workflow_name:
        description: Display name of the completed workflow.
        required: true
        type: string
      branch:
        description: Head branch of the completed workflow.
        required: true
        type: string
      head_sha:
        description: Head commit SHA of the completed workflow.
        required: true
        type: string
      conclusion:
        description: Conclusion of the completed workflow.
        required: true
        type: string
      run_attempt:
        description: Attempt number of the completed workflow run.
        required: true
        type: number
      run_url:
        description: Browser URL for the completed workflow run.
        required: true
        type: string
      actor:
        description: GitHub login that initiated the completed workflow.
        required: true
        type: string
      commit_message:
        description: Commit message associated with the completed workflow.
        required: false
        default: ""
        type: string
    outputs:
      channel_id:
        description: Channel containing the parent notification.
        value: ${{ jobs.notify.outputs.channel_id }}
      message_ts:
        description: Parent message timestamp for threaded follow-ups.
        value: ${{ jobs.notify.outputs.message_ts }}
    secrets:
      openai_api_key:
        description: Deprecated compatibility input; analysis uses the bridge Codex ChatGPT login.
        required: false
      slack_bot_token:
        description: Slack bot token with chat:write access to the target channel.
        required: true

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      channel_id: ${{ steps.post.outputs.channel_id }}
      message_ts: ${{ steps.post.outputs.ts }}
    steps:
      - name: Validate notification inputs
        shell: bash
        env:
          CHANNEL_ID: ${{ inputs.channel_id }}
          REPOSITORY: ${{ inputs.repository }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_URL: ${{ inputs.run_url }}
        run: |
          set -euo pipefail
          : "${CHANNEL_ID:?channel_id must be configured with a Slack channel ID}"
          : "${REPOSITORY:?repository is required}"
          : "${RUN_ID:?run_id is required}"
          : "${RUN_URL:?run_url is required}"

          if [[ ! "${REPOSITORY}" =~ ^[^/]+/[^/]+$ ]]; then
            echo "repository must use owner/name form: ${REPOSITORY}" >&2
            exit 1
          fi
          if [[ ! "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "run_id must be numeric: ${RUN_ID}" >&2
            exit 1
          fi

      - name: Compose failure notification
        id: compose
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHANNEL_ID: ${{ inputs.channel_id }}
          RUN_ID: ${{ inputs.run_id }}
          REPOSITORY: ${{ inputs.repository }}
          WORKFLOW_NAME: ${{ inputs.workflow_name }}
          BRANCH: ${{ inputs.branch }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CONCLUSION: ${{ inputs.conclusion }}
          RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RUN_URL: ${{ inputs.run_url }}
          ACTOR: ${{ inputs.actor }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const repositoryParts = process.env.REPOSITORY.split("/");
            if (repositoryParts.length !== 2 || repositoryParts.some((part) => !part)) {
              core.setFailed(`Invalid repository input: ${process.env.REPOSITORY}`);
              return;
            }

            const [owner, repo] = repositoryParts;
            const runId = Number(process.env.RUN_ID);
            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRunAttempt,
              {
                owner,
                repo,
                run_id: runId,
                per_page: 100,
                attempt_number: Number(process.env.RUN_ATTEMPT),
              },
            );

            const actionableConclusions = new Set([
              "failure",
              "timed_out",
              "action_required",
              "startup_failure",
              "stale",
            ]);
            const failedJobs = jobs.filter((job) => actionableConclusions.has(job.conclusion));

            const escapeMrkdwn = (value) => String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;");
            const truncate = (value, limit) => {
              const characters = Array.from(String(value ?? ""));
              return characters.length <= limit
                ? characters.join("")
                : `${characters.slice(0, limit - 1).join("")}…`;
            };
            const label = (value) => String(value ?? "unknown").replaceAll("_", " ");

            const visibleJobs = failedJobs.slice(0, 8);
            let failedJobText = visibleJobs.map((job) => {
              const name = escapeMrkdwn(truncate(job.name, 180));
              const conclusion = escapeMrkdwn(label(job.conclusion));
              return `• <${job.html_url}|${name}> — ${conclusion}`;
            }).join("\n");
            if (failedJobs.length > visibleJobs.length) {
              failedJobText += `\n• …and ${failedJobs.length - visibleJobs.length} more`;
            }
            if (!failedJobText) {
              failedJobText = "No individual failed job was returned by the Actions API. Open the run for details.";
            }

            const conclusion = escapeMrkdwn(label(process.env.CONCLUSION));
            const repository = escapeMrkdwn(process.env.REPOSITORY);
            const workflow = escapeMrkdwn(process.env.WORKFLOW_NAME);
            const branch = escapeMrkdwn(process.env.BRANCH);
            const actor = escapeMrkdwn(process.env.ACTOR);
            const shortSha = escapeMrkdwn(process.env.HEAD_SHA.slice(0, 12));
            const commitTitle = escapeMrkdwn(truncate(
              process.env.COMMIT_MESSAGE.split(/\r?\n/, 1)[0] || "Commit message unavailable",
              300,
            ));
            const fallback = `${workflow} ${conclusion} on ${repository}@${branch}`;

            return JSON.stringify({
              channel: process.env.CHANNEL_ID,
              text: fallback,
              unfurl_links: false,
              unfurl_media: false,
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: "Vulcan CI requires attention",
                  },
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: `*Repository*\n${repository}` },
                    { type: "mrkdwn", text: `*Workflow*\n${workflow}` },
                    { type: "mrkdwn", text: `*Branch*\n${branch}` },
                    { type: "mrkdwn", text: `*Conclusion*\n${conclusion}` },
                    { type: "mrkdwn", text: `*Actor*\n${actor}` },
                    { type: "mrkdwn", text: `*Attempt*\n${process.env.RUN_ATTEMPT}` },
                  ],
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: `*Commit*\n\`${shortSha}\` ${commitTitle}`,
                  },
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: `*Failed jobs*\n${failedJobText}`,
                  },
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: { type: "plain_text", text: "Open workflow run" },
                      url: process.env.RUN_URL,
                      style: "danger",
                    },
                  ],
                },
              ],
            });

      - name: Post failure notification to Slack
        id: post
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          errors: true
          method: chat.postMessage
          token: ${{ secrets.slack_bot_token }}
          payload: ${{ steps.compose.outputs.result }}

  analyze:
    needs: notify
    if: inputs.analyze_failure
    uses: ./.github/workflows/reusable-failure-analysis.yml
    with:
      repository: ${{ inputs.repository }}
      run_id: ${{ inputs.run_id }}
      run_attempt: ${{ inputs.run_attempt }}
      channel_id: ${{ needs.notify.outputs.channel_id }}
      thread_ts: ${{ needs.notify.outputs.message_ts }}
    secrets:
      slack_bot_token: ${{ secrets.slack_bot_token }}
