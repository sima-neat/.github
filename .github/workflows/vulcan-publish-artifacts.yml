name: Vulcan Publish Artifacts

on:
  workflow_call:
    inputs:
      bucket:
        description: Vulcan artifact S3 bucket name.
        required: false
        default: ""
        type: string
      role_to_assume:
        description: AWS IAM role ARN to assume with GitHub OIDC.
        required: false
        default: ""
        type: string
      config_s3_uri:
        description: Optional Vulcan environment config S3 URI.
        required: false
        default: ""
        type: string
      config_reader_role_arn:
        description: Optional AWS IAM role ARN used to read the Vulcan environment config.
        required: false
        default: ""
        type: string
      artifact_namespace:
        description: Optional registered primary or alias artifact root owned by the caller repository.
        required: false
        default: ""
        type: string
      aws_region:
        description: AWS region for S3 and STS.
        required: false
        default: us-west-2
        type: string
      environment_name:
        description: GitHub environment name.
        required: false
        default: dev
        type: string
      artifact_folder:
        description: Optional folder inside the commit artifact directory.
        required: false
        default: ""
        type: string
      source_branch:
        description: Optional source branch used for the artifact path. Empty uses the caller workflow branch.
        required: false
        default: ""
        type: string
      source_commit:
        description: Optional source commit SHA used for the artifact path. Empty uses the caller workflow SHA.
        required: false
        default: ""
        type: string
      artifact_pattern:
        description: actions/download-artifact pattern.
        required: true
        type: string
      artifact_glob:
        description: File glob to publish after artifact download.
        required: false
        default: "**/*"
        type: string
      min_artifact_count:
        description: Minimum expected matching file count.
        required: false
        default: 1
        type: number
      download_path:
        description: Local path where GitHub artifacts are downloaded.
        required: false
        default: _vulcan/downloaded-artifacts
        type: string
      merge_multiple:
        description: Merge matching GitHub artifacts into one directory.
        required: false
        default: true
        type: boolean
      publish_manifest:
        description: Generate and upload manifest.json for the published files.
        required: false
        default: true
        type: boolean
      install_awscli:
        description: Install AWS CLI v2 before publishing.
        required: false
        default: false
        type: boolean
      sse_kms_key_id:
        description: Optional KMS key ID, alias, or ARN for uploaded artifacts. Empty uses VULCAN_ARTIFACT_KMS_KEY_ID from the selected environment.
        required: false
        default: ""
        type: string
      cloudfront_distribution_id:
        description: Optional CloudFront distribution ID to invalidate after publishing. Empty uses VULCAN_ARTIFACT_CLOUDFRONT_DISTRIBUTION_ID from the selected environment.
        required: false
        default: ""
        type: string
      artifact_base_url:
        description: Optional artifact CloudFront base URL used to verify published metadata. Empty uses VULCAN_ARTIFACT_BASE_URL from the selected environment.
        required: false
        default: ""
        type: string
      cleanup_github_artifacts:
        description: Delete matching GitHub Actions artifacts after a successful S3 publish.
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  actions: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish Vulcan artifacts
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    env:
      AWS_REGION: ${{ inputs.aws_region }}
      ARTIFACT_BUCKET: ${{ inputs.bucket || vars.VULCAN_ARTIFACT_BUCKET }}
      ARTIFACT_FOLDER_INPUT: ${{ inputs.artifact_folder }}
      ARTIFACT_NAMESPACE_INPUT: ${{ inputs.artifact_namespace }}
      SOURCE_BRANCH_INPUT: ${{ inputs.source_branch }}
      SOURCE_COMMIT_INPUT: ${{ inputs.source_commit }}
      ARTIFACT_PATTERN: ${{ inputs.artifact_pattern }}
      ARTIFACT_GLOB: ${{ inputs.artifact_glob }}
      DOWNLOAD_PATH: ${{ inputs.download_path }}
      MIN_ARTIFACT_COUNT: ${{ inputs.min_artifact_count }}
      PUBLISH_MANIFEST: ${{ inputs.publish_manifest }}
      SSE_KMS_KEY_ID: ${{ inputs.sse_kms_key_id || vars.VULCAN_ARTIFACT_KMS_KEY_ID }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id || vars.VULCAN_ARTIFACT_CLOUDFRONT_DISTRIBUTION_ID }}
      ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url || vars.VULCAN_ARTIFACT_BASE_URL }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Resolve Vulcan config location
        id: config-location
        shell: bash
        env:
          INPUT_ENVIRONMENT_NAME: ${{ inputs.environment_name }}
          INPUT_BUCKET: ${{ inputs.bucket }}
          INPUT_ROLE_TO_ASSUME: ${{ inputs.role_to_assume }}
          INPUT_SSE_KMS_KEY_ID: ${{ inputs.sse_kms_key_id }}
          INPUT_CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id }}
          INPUT_ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url }}
          INPUT_CONFIG_S3_URI: ${{ inputs.config_s3_uri }}
          INPUT_CONFIG_READER_ROLE_ARN: ${{ inputs.config_reader_role_arn }}
          VAR_BUCKET: ${{ vars.VULCAN_ARTIFACT_BUCKET }}
          VAR_ROLE_TO_ASSUME: ${{ vars.VULCAN_ARTIFACT_PUBLISHER_ROLE_ARN }}
          VAR_SSE_KMS_KEY_ID: ${{ vars.VULCAN_ARTIFACT_KMS_KEY_ID }}
          VAR_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.VULCAN_ARTIFACT_CLOUDFRONT_DISTRIBUTION_ID }}
          VAR_ARTIFACT_BASE_URL: ${{ vars.VULCAN_ARTIFACT_BASE_URL }}
          VAR_CONFIG_S3_URI: ${{ vars.VULCAN_CONFIG_S3_URI }}
          VAR_CONFIG_READER_ROLE_ARN: ${{ vars.VULCAN_CONFIG_READER_ROLE_ARN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          env_name="${INPUT_ENVIRONMENT_NAME:-dev}"
          case "${env_name}" in
            dev)
              config_env="dev"
              default_config_s3_uri="s3://sima-neat-vulcan-config-dev/_vulcan/github-actions/environment.json"
              default_reader_role_arn="arn:aws:iam::${{ vars.VULCAN_DEV_AWS_ACCOUNT_ID }}:role/NeatDevVulcanConfigReaderRole"
              ;;
            stg|staging)
              config_env="stg"
              default_config_s3_uri="s3://sima-neat-vulcan-config-staging/_vulcan/github-actions/environment.json"
              default_reader_role_arn="arn:aws:iam::${{ vars.VULCAN_STAGING_AWS_ACCOUNT_ID }}:role/NeatStagingVulcanConfigReaderRole"
              ;;
            prod|production)
              config_env="prod"
              default_config_s3_uri="s3://sima-neat-vulcan-config-production/_vulcan/github-actions/environment.json"
              default_reader_role_arn="arn:aws:iam::${{ vars.VULCAN_PRODUCTION_AWS_ACCOUNT_ID }}:role/NeatProductionVulcanConfigReaderRole"
              ;;
            *)
              echo "Unsupported Vulcan environment: ${env_name}" >&2
              exit 1
              ;;
          esac

          bucket="${INPUT_BUCKET:-${VAR_BUCKET:-}}"
          role_to_assume="${INPUT_ROLE_TO_ASSUME:-${VAR_ROLE_TO_ASSUME:-}}"
          sse_kms_key_id="${INPUT_SSE_KMS_KEY_ID:-${VAR_SSE_KMS_KEY_ID:-}}"
          cloudfront_distribution_id="${INPUT_CLOUDFRONT_DISTRIBUTION_ID:-${VAR_CLOUDFRONT_DISTRIBUTION_ID:-}}"
          artifact_base_url="${INPUT_ARTIFACT_BASE_URL:-${VAR_ARTIFACT_BASE_URL:-}}"
          # Repository namespaces and owner-specific publisher roles are owned
          # by the Vulcan config. Always load it so a registered namespace that
          # differs from the repository name cannot silently fall back to the
          # legacy path when all direct publish settings are already populated.
          needs_config=true

          config_s3_uri="${INPUT_CONFIG_S3_URI:-${VAR_CONFIG_S3_URI:-${default_config_s3_uri}}}"
          reader_role_arn="${INPUT_CONFIG_READER_ROLE_ARN:-${VAR_CONFIG_READER_ROLE_ARN:-${default_reader_role_arn}}}"
          if [[ "${needs_config}" == "true" && ( -z "${reader_role_arn}" || "${reader_role_arn}" == *":::"* ) ]]; then
            echo "Missing config reader role ARN for Vulcan environment '${config_env}'." >&2
            exit 1
          fi

          {
            echo "config_env=${config_env}"
            echo "config_s3_uri=${config_s3_uri}"
            echo "reader_role_arn=${reader_role_arn}"
            echo "needs_config=${needs_config}"
            echo "bucket=${bucket}"
            echo "role_to_assume=${role_to_assume}"
            echo "sse_kms_key_id=${sse_kms_key_id}"
            echo "cloudfront_distribution_id=${cloudfront_distribution_id}"
            echo "artifact_base_url=${artifact_base_url}"
          } >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials for Vulcan config
        if: ${{ steps.config-location.outputs.needs_config == 'true' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: ${{ steps.config-location.outputs.reader_role_arn }}
          role-session-name: vulcan-config-${{ github.run_id }}

      - name: Resolve Vulcan publish settings
        id: publish-settings
        shell: bash
        env:
          INPUT_AWS_REGION: ${{ inputs.aws_region }}
          CONFIG_ENV: ${{ steps.config-location.outputs.config_env }}
          CONFIG_S3_URI: ${{ steps.config-location.outputs.config_s3_uri }}
          NEEDS_CONFIG: ${{ steps.config-location.outputs.needs_config }}
          EXISTING_BUCKET: ${{ steps.config-location.outputs.bucket }}
          EXISTING_ROLE_TO_ASSUME: ${{ steps.config-location.outputs.role_to_assume }}
          EXISTING_SSE_KMS_KEY_ID: ${{ steps.config-location.outputs.sse_kms_key_id }}
          EXISTING_CLOUDFRONT_DISTRIBUTION_ID: ${{ steps.config-location.outputs.cloudfront_distribution_id }}
          EXISTING_ARTIFACT_BASE_URL: ${{ steps.config-location.outputs.artifact_base_url }}
          INPUT_ROLE_TO_ASSUME: ${{ inputs.role_to_assume }}
          INPUT_ARTIFACT_NAMESPACE: ${{ inputs.artifact_namespace }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          aws_region="${INPUT_AWS_REGION:-us-west-2}"
          bucket="${EXISTING_BUCKET}"
          role_to_assume="${EXISTING_ROLE_TO_ASSUME}"
          sse_kms_key_id="${EXISTING_SSE_KMS_KEY_ID}"
          cloudfront_distribution_id="${EXISTING_CLOUDFRONT_DISTRIBUTION_ID}"
          artifact_base_url="${EXISTING_ARTIFACT_BASE_URL}"
          source_owner="${SOURCE_REPOSITORY%%/*}"
          source_name="${SOURCE_REPOSITORY#*/}"
          artifact_namespace=""
          artifact_namespace_aliases='[]'
          repository_role_to_assume=""
          owner_role_to_assume=""
          legacy_role_to_assume=""

          if [[ "${NEEDS_CONFIG}" == "true" ]]; then
            config_file="$(mktemp)"
            aws s3 cp "${CONFIG_S3_URI}" "${config_file}" --only-show-errors
            jq -e . "${config_file}" >/dev/null

            config_env="$(jq -r '.environment // empty' "${config_file}")"
            case "${config_env}:${CONFIG_ENV}" in
              :*|dev:dev|stg:stg|staging:stg|prod:prod|production:prod)
                ;;
              *)
                echo "Config environment '${config_env}' does not match requested environment '${CONFIG_ENV}'." >&2
                exit 1
                ;;
            esac

            aws_region="${aws_region:-$(jq -r '.aws_region // empty' "${config_file}")}"
            bucket="${bucket:-$(jq -r '.artifacts.bucket // empty' "${config_file}")}"
            repository_role_to_assume="$(jq -r --arg repository "${SOURCE_REPOSITORY}" '.artifacts.publisher_repository_roles[$repository] // empty' "${config_file}")"
            owner_role_to_assume="$(jq -r --arg owner "${source_owner}" '.artifacts.publisher_roles[$owner] // empty' "${config_file}")"
            legacy_role_to_assume="$(jq -r '.artifacts.publisher_role_arn // empty' "${config_file}")"
            artifact_namespace="$(jq -r --arg repository "${SOURCE_REPOSITORY}" '.artifacts.namespace_registry[$repository] // empty' "${config_file}")"
            artifact_namespace_aliases="$(jq -c --arg repository "${SOURCE_REPOSITORY}" '.artifacts.namespace_aliases[$repository] // []' "${config_file}")"
            sse_kms_key_id="${sse_kms_key_id:-$(jq -r '.artifacts.kms_key_id // empty' "${config_file}")}"
            cloudfront_distribution_id="${cloudfront_distribution_id:-$(jq -r '.artifacts.cloudfront_distribution_id // empty' "${config_file}")}"
            artifact_base_url="${artifact_base_url:-$(jq -r '.artifacts.base_url // empty' "${config_file}")}"
          fi

          if [[ "${source_owner}" == "sima-neat" ]]; then
            role_to_assume="${role_to_assume:-${repository_role_to_assume:-${owner_role_to_assume:-${legacy_role_to_assume}}}}"
            artifact_namespace="${artifact_namespace:-${source_name}}"
          else
            registered_role_to_assume="${repository_role_to_assume:-${owner_role_to_assume}}"
            if [[ -z "${artifact_namespace}" || -z "${registered_role_to_assume}" ]]; then
              echo "Repository '${SOURCE_REPOSITORY}' is not registered for Vulcan artifact publishing." >&2
              exit 1
            fi
            if [[ -n "${INPUT_ROLE_TO_ASSUME}" && "${INPUT_ROLE_TO_ASSUME}" != "${registered_role_to_assume}" ]]; then
              echo "Explicit publisher role does not match the role registered for '${SOURCE_REPOSITORY}'." >&2
              exit 1
            fi
            role_to_assume="${registered_role_to_assume}"
          fi
          if [[ -n "${INPUT_ARTIFACT_NAMESPACE}" ]]; then
            if [[ "${INPUT_ARTIFACT_NAMESPACE}" != "${artifact_namespace}" ]] && ! jq -ne \
              --arg requested "${INPUT_ARTIFACT_NAMESPACE}" \
              --argjson aliases "${artifact_namespace_aliases}" \
              '$aliases | index($requested) != null' >/dev/null; then
              echo "Artifact namespace '${INPUT_ARTIFACT_NAMESPACE}' is not registered to '${SOURCE_REPOSITORY}'." >&2
              exit 1
            fi
            artifact_namespace="${INPUT_ARTIFACT_NAMESPACE}"
          fi

          for required in aws_region bucket role_to_assume; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing required Vulcan publish setting: ${required}" >&2
              exit 1
            fi
          done

          {
            echo "aws_region=${aws_region}"
            echo "bucket=${bucket}"
            echo "role_to_assume=${role_to_assume}"
            echo "sse_kms_key_id=${sse_kms_key_id}"
            echo "cloudfront_distribution_id=${cloudfront_distribution_id}"
            echo "artifact_base_url=${artifact_base_url}"
            echo "artifact_namespace=${artifact_namespace}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "AWS_REGION=${aws_region}"
            echo "ARTIFACT_BUCKET=${bucket}"
            echo "SSE_KMS_KEY_ID=${sse_kms_key_id}"
            echo "CLOUDFRONT_DISTRIBUTION_ID=${cloudfront_distribution_id}"
            echo "ARTIFACT_BASE_URL=${artifact_base_url}"
            echo "ARTIFACT_NAMESPACE=${artifact_namespace}"
          } >> "${GITHUB_ENV}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ steps.publish-settings.outputs.aws_region }}
          role-to-assume: ${{ steps.publish-settings.outputs.role_to_assume }}
          role-session-name: vulcan-publish-${{ github.run_id }}

      - name: Install aws cli tooling
        if: ${{ inputs.install_awscli }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) aws_arch="x86_64" ;;
            aarch64|arm64) aws_arch="aarch64" ;;
            *) echo "Unsupported architecture for AWS CLI v2: $(uname -m)" >&2; exit 1 ;;
          esac

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" -o "$tmpdir/awscliv2.zip"
          python3 -m zipfile -e "$tmpdir/awscliv2.zip" "$tmpdir"

          install_dir="${HOME}/.local/aws-cli"
          bin_dir="${HOME}/.local/bin"
          mkdir -p "$bin_dir"

          install_args=(-i "$install_dir" -b "$bin_dir")
          if [[ -x "$bin_dir/aws" ]]; then
            install_args+=(--update)
          fi
          "$tmpdir/aws/install" "${install_args[@]}"

          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/aws" --version

      - name: Verify aws cli is available
        if: ${{ !inputs.install_awscli }}
        run: |
          set -euo pipefail
          aws --version
          for key in ARTIFACT_BUCKET; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required ${key}. Set the input or environment variable." >&2
              exit 1
            fi
          done

      - name: Download GitHub artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: ${{ inputs.download_path }}
          merge-multiple: ${{ inputs.merge_multiple }}

      - name: Publish artifacts and branch index
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from urllib.parse import quote
          from datetime import datetime, timezone
          from pathlib import Path

          def clean_path_part(raw: str, fallback: str) -> str:
              value = raw.strip() or fallback
              value = value.replace("/", "-")
              value = re.sub(r"[^A-Za-z0-9._-]+", "-", value)
              value = re.sub(r"-+", "-", value).strip(".-")
              if not value:
                  raise SystemExit(f"Invalid path component: {raw!r}")
              return value

          def branch_key(raw: str) -> str:
              value = raw.strip()
              if not value:
                  raise SystemExit("Branch name is empty.")
              return quote(value, safe="")

          def cloudfront_viewer_path(s3_key: str) -> str:
              # S3 keys contain an already encoded branch segment such as
              # feature%2Ffoo. Encode the literal percent sign again because
              # CloudFront invalidations match the viewer URI, not the S3 key.
              return "/" + quote(s3_key.lstrip("/"), safe="/")

          def run(*args: str) -> None:
              print("+", " ".join(args), flush=True)
              subprocess.run(args, check=True)

          def run_output(*args: str) -> str:
              print("+", " ".join(args), flush=True)
              return subprocess.check_output(args, text=True).strip()

          def s3_cp_args() -> list[str]:
              args = ["--sse", "aws:kms"]
              key_id = os.environ.get("SSE_KMS_KEY_ID", "").strip()
              if key_id:
                  args.extend(["--sse-kms-key-id", key_id])
              return args

          def artifact_folder_key(raw: str) -> str:
              value = raw.strip()
              if value in {"", ".", "./"}:
                  return ""
              return clean_path_part(value, "artifacts")

          def sha256_file(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def s3_prefix_has_objects(bucket: str, prefix: str) -> bool:
              key_count = run_output(
                  "aws", "s3api", "list-objects-v2",
                  "--bucket", bucket,
                  "--prefix", f"{prefix.rstrip('/')}/",
                  "--max-keys", "1",
                  "--query", "KeyCount",
                  "--output", "text",
              )
              try:
                  return int(key_count) > 0
              except ValueError as exc:
                  raise SystemExit(
                      f"Unable to determine whether S3 prefix exists: {prefix} (KeyCount={key_count!r})"
                  ) from exc

          def verify_cloudfront_file(base_url: str, viewer_path: str, expected_sha256: str) -> bool:
              url = f"{base_url.rstrip('/')}{viewer_path}"
              attempts = 4
              for attempt in range(1, attempts + 1):
                  try:
                      with urllib.request.urlopen(url, timeout=60) as resp:
                          actual_sha256 = hashlib.sha256(resp.read()).hexdigest()
                      if actual_sha256 == expected_sha256:
                          print(f"Verified published artifact through CloudFront: {url}")
                          return True
                      detail = f"SHA-256 {actual_sha256}, expected {expected_sha256}"
                  except urllib.error.URLError as exc:
                      detail = str(exc)

                  if attempt == attempts:
                      print(f"CloudFront verification failed for {url}: {detail}", flush=True)
                      return False
                  delay = attempt * 5
                  print(
                      f"CloudFront verification attempt {attempt}/{attempts} failed for {url}: "
                      f"{detail}; retrying in {delay}s.",
                      flush=True,
                  )
                  time.sleep(delay)

              raise AssertionError("unreachable")

          def create_cloudfront_invalidation(distribution_id: str, viewer_prefix: str) -> None:
              invalidation_id = run_output(
                  "aws", "cloudfront", "create-invalidation",
                  "--distribution-id", distribution_id,
                  "--paths", f"{viewer_prefix.rstrip('/')}/*",
                  "--query", "Invalidation.Id",
                  "--output", "text",
              )
              if not invalidation_id or invalidation_id == "None":
                  raise SystemExit("CloudFront create-invalidation did not return an invalidation ID.")
              run(
                  "aws", "cloudfront", "wait", "invalidation-completed",
                  "--distribution-id", distribution_id,
                  "--id", invalidation_id,
              )

          def ensure_cloudfront_consistency(
              distribution_id: str,
              base_url: str,
              commit_viewer_prefix: str,
              verification_path: str,
              expected_sha256: str,
              prefix_existed: bool,
          ) -> None:
              if verification_path and not base_url:
                  raise SystemExit(
                      "Artifact base URL is required to verify published CloudFront metadata."
                  )

              if prefix_existed:
                  print("Commit prefix already exists; invalidating it before CDN verification.")
                  create_cloudfront_invalidation(distribution_id, commit_viewer_prefix)

              if not verification_path:
                  print("No metadata or manifest file was published; skipping CloudFront content verification.")
                  return

              if verify_cloudfront_file(base_url, verification_path, expected_sha256):
                  return

              if prefix_existed:
                  raise SystemExit(
                      "CloudFront verification failed after invalidating the existing commit prefix."
                  )

              print(
                  "CDN verification failed for a new commit prefix; "
                  "invalidating the prefix to clear possible cached negative or stale content.",
                  flush=True,
              )
              create_cloudfront_invalidation(distribution_id, commit_viewer_prefix)
              if not verify_cloudfront_file(base_url, verification_path, expected_sha256):
                  raise SystemExit(
                      "CloudFront verification failed after fallback invalidation of the new commit prefix."
                  )

          def github_headers(token: str = "") -> dict[str, str]:
              headers = {
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "vulcan-publish-artifacts",
              }
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              return headers

          def request_json(url: str, headers: dict[str, str], label: str) -> dict | list:
              attempts = 3
              for attempt in range(1, attempts + 1):
                  req = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(req, timeout=15) as resp:
                          request_id = resp.headers.get("X-GitHub-Request-Id", "unknown")
                          print(f"GitHub API {label} succeeded (request_id={request_id}).")
                          return json.loads(resp.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      request_id = exc.headers.get("X-GitHub-Request-Id", "unknown")
                      retryable = 500 <= exc.code < 600
                      if not retryable or attempt == attempts:
                          print(
                              f"GitHub API {label} failed: HTTP {exc.code} {exc.reason} "
                              f"(request_id={request_id}, attempt={attempt}/{attempts}).",
                              flush=True,
                          )
                          raise
                      delay = 2 ** (attempt - 1)
                      print(
                          f"GitHub API {label} returned HTTP {exc.code} {exc.reason} "
                          f"(request_id={request_id}, attempt={attempt}/{attempts}); retrying in {delay}s.",
                          flush=True,
                      )
                      time.sleep(delay)

              raise AssertionError("unreachable")

          def fetch_branch_index(repo: str, headers: dict[str, str], label: str) -> dict:
              branches = []
              page = 1
              while True:
                  url = f"https://api.github.com/repos/{repo}/branches?per_page=100&page={page}"
                  batch = request_json(url, headers, f"{label} branch list page {page}")
                  if not isinstance(batch, list):
                      raise SystemExit(f"GitHub API {label} branch list returned an unexpected response.")
                  if not batch:
                      break
                  for item in batch:
                      name = str(item["name"])
                      branches.append({
                          "name": name,
                          "key": branch_key(name),
                          "protected": bool(item.get("protected", False)),
                          "commit": str(item.get("commit", {}).get("sha", "")),
                      })
                  if len(batch) < 100:
                      break
                  page += 1

              repo_doc = request_json(f"https://api.github.com/repos/{repo}", headers, f"{label} repository metadata")
              if not isinstance(repo_doc, dict):
                  raise SystemExit(f"GitHub API {label} repository metadata returned an unexpected response.")
              default_branch = str(repo_doc.get("default_branch", ""))

              return {
                  "repository": repo,
                  "default_branch": default_branch,
                  "generated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "branches": sorted(branches, key=lambda b: b["name"].lower()),
              }

          def fetch_branches(repo: str, token: str) -> dict:
              try:
                  return fetch_branch_index(repo, github_headers(token), "authenticated")
              except urllib.error.HTTPError as exc:
                  if not 500 <= exc.code < 600:
                      raise

                  try:
                      public_repo = request_json(
                          f"https://api.github.com/repos/{repo}",
                          github_headers(),
                          "unauthenticated repository visibility check",
                      )
                  except urllib.error.HTTPError:
                      print("Skipping unauthenticated branch-index fallback because repository visibility could not be verified.")
                      raise exc

                  if not isinstance(public_repo, dict) or public_repo.get("private", True):
                      print("Skipping unauthenticated branch-index fallback because the repository is not publicly readable.")
                      raise exc

                  print("Authenticated GitHub branch-index request exhausted transient retries; retrying through the public API.")
                  return fetch_branch_index(repo, github_headers(), "unauthenticated public fallback")

          github_repo = os.environ["GITHUB_REPOSITORY"]
          artifact_namespace = clean_path_part(os.environ["ARTIFACT_NAMESPACE"], "repository")
          branch_raw = (
              os.environ.get("SOURCE_BRANCH_INPUT", "").strip()
              or os.environ.get("GITHUB_HEAD_REF")
              or os.environ["GITHUB_REF_NAME"]
          )
          encoded_branch_key = branch_key(branch_raw)
          artifact_folder = artifact_folder_key(os.environ["ARTIFACT_FOLDER_INPUT"])
          commit = os.environ.get("SOURCE_COMMIT_INPUT", "").strip() or os.environ["GITHUB_SHA"]
          short_commit = commit[:12]

          download_path = Path(os.environ["DOWNLOAD_PATH"])
          if not download_path.exists():
              raise SystemExit(f"Download path does not exist: {download_path}")

          files = [
              p for p in sorted(download_path.glob(os.environ["ARTIFACT_GLOB"]))
              if p.is_file()
          ]
          min_count = int(os.environ["MIN_ARTIFACT_COUNT"])
          if len(files) < min_count:
              raise SystemExit(f"Expected at least {min_count} artifact(s), found {len(files)}")

          bucket = os.environ["ARTIFACT_BUCKET"]
          commit_prefix = "/".join([artifact_namespace, encoded_branch_key, short_commit])
          prefix_parts = [commit_prefix]
          if artifact_folder:
              prefix_parts.append(artifact_folder)
          prefix = "/".join(prefix_parts)
          distribution_id = os.environ.get("CLOUDFRONT_DISTRIBUTION_ID", "").strip()
          source_owner = os.environ["GITHUB_REPOSITORY"].split("/", 1)[0]
          manage_cloudfront = bool(distribution_id and source_owner == "sima-neat")
          prefix_existed = manage_cloudfront and s3_prefix_has_objects(bucket, commit_prefix)
          now = datetime.now(timezone.utc).isoformat()
          manifest_entries = []
          published_checksums = {}

          for path in files:
              rel = path.relative_to(download_path)
              rel_key = "/".join(rel.parts)
              target = f"s3://{bucket}/{prefix}/{rel_key}"
              run("aws", "s3", "cp", str(path), target, *s3_cp_args())
              checksum = sha256_file(path)
              published_checksums[rel_key] = checksum
              manifest_entries.append({
                  "path": rel_key,
                  "s3_key": f"{prefix}/{rel_key}",
                  "size": path.stat().st_size,
                  "sha256": checksum,
              })

          index_dir = Path("_vulcan/index")
          index_dir.mkdir(parents=True, exist_ok=True)

          if os.environ["PUBLISH_MANIFEST"].lower() == "true":
              manifest = {
                  "repository": github_repo,
                  "repository_key": artifact_namespace,
                  "branch": branch_raw,
                  "branch_key": encoded_branch_key,
                  "commit_folder": short_commit,
                  "artifact_folder": artifact_folder,
                  "commit": commit,
                  "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
                  "published_at_utc": now,
                  "artifacts": manifest_entries,
              }
              manifest_path = index_dir / "manifest.json"
              manifest_path.write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
              run(
                  "aws", "s3", "cp", str(manifest_path),
                  f"s3://{bucket}/{prefix}/manifest.json",
                  "--content-type", "application/json",
                  *s3_cp_args(),
              )
              published_checksums["manifest.json"] = sha256_file(manifest_path)

          branches = fetch_branches(github_repo, os.environ["GH_TOKEN"])
          branches_path = index_dir / "branches.json"
          branches_path.write_text(json.dumps(branches, indent=2) + "\n", encoding="utf-8")
          run(
              "aws", "s3", "cp", str(branches_path),
              f"s3://{bucket}/{artifact_namespace}/branches.json",
              "--content-type", "application/json",
              *s3_cp_args(),
          )

          # Cross-owner publishers are intentionally denied distribution-wide
          # invalidation. Their mutable indexes use non-caching behaviors.
          if manage_cloudfront:
              verification_key = next(
                  (
                      key for filename in ("metadata-all.json", "metadata.json", "manifest.json")
                      for key in published_checksums
                      if key.rsplit("/", 1)[-1] == filename
                  ),
                  "",
              )
              verification_path = (
                  cloudfront_viewer_path(f"{prefix}/{verification_key}")
                  if verification_key else ""
              )
              ensure_cloudfront_consistency(
                  distribution_id,
                  os.environ.get("ARTIFACT_BASE_URL", "").strip(),
                  cloudfront_viewer_path(commit_prefix),
                  verification_path,
                  published_checksums.get(verification_key, ""),
                  prefix_existed,
              )

          print(f"published_count={len(files)}")
          print(f"published_prefix=s3://{bucket}/{prefix}/")
          print(f"branches_index=s3://{bucket}/{artifact_namespace}/branches.json")
          PY

      - name: Delete temporary GitHub artifacts
        if: ${{ inputs.cleanup_github_artifacts }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import fnmatch
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = os.environ["GITHUB_RUN_ID"]
          token = os.environ["GH_TOKEN"]
          pattern = os.environ["ARTIFACT_PATTERN"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(method: str, url: str) -> bytes:
              req = urllib.request.Request(url, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return resp.read()
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"{method} {url} failed: HTTP {exc.code}: {body}") from exc

          deleted = 0
          page = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100&page={page}"
              payload = json.loads(request("GET", url).decode("utf-8"))
              artifacts = payload.get("artifacts", [])
              if not artifacts:
                  break

              for artifact in artifacts:
                  name = str(artifact.get("name", ""))
                  artifact_id = artifact.get("id")
                  if artifact_id is not None and fnmatch.fnmatchcase(name, pattern):
                      delete_url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}"
                      request("DELETE", delete_url)
                      print(f"Deleted temporary GitHub artifact: {name} ({artifact_id})")
                      deleted += 1

              if len(artifacts) < 100:
                  break
              page += 1

          print(f"deleted_github_artifacts={deleted}")
          PY
