name: Vulcan Resolve Modalix Runner

on:
  workflow_call:
    inputs:
      manifest_path:
        description: Path to the dependency manifest in the caller repository.
        required: false
        default: deps/manifest.json
        type: string
      manifest_artifact:
        description: Optional artifact from this run containing the resolved dependency manifest.
        required: false
        default: ''
        type: string
      allow-version-fallback:
        description: Allow dropping only the firmware label when no online exact match exists.
        type: boolean
        default: false
      runner-labels:
        description: JSON array of all required hardware and environment labels.
        type: string
        default: '["self-hosted", "Linux", "ARM64", "modalix"]'
      shared_workflow_ref:
        description: Deprecated compatibility input; resolver code is bundled with this workflow revision.
        required: false
        type: string
      legacy_platform_version:
        description: Platform version that uses the legacy Modalix runner group.
        required: false
        default: 2.0.0
        type: string
      legacy_runner_group:
        description: Runner group used for the legacy platform version.
        required: false
        default: modalix-devkit
        type: string
      versioned_runner_group_prefix:
        description: Prefix for versioned Modalix runner groups.
        required: false
        default: modalix-devkit-
        type: string
    secrets:
      app_id:
        description: Existing GitHub App ID for runner discovery.
        required: false
      app_private_key:
        description: Existing GitHub App private key for runner discovery.
        required: false
      RUNNER_DISCOVERY_TOKEN:
        description: Token with organization self-hosted-runners read access; required for elxr_version.
        required: false
    outputs:
      runner_labels:
        description: JSON array of resolved labels, including exact firmware unless fallback was used.
        value: ${{ jobs.resolve.outputs.runner_labels }}
      elxr_version:
        description: Requested SDK/sysroot identity from the manifest; preserved before DevKit translation.
        value: ${{ jobs.resolve.outputs.elxr_version }}
      devkit_firmware:
        description: Exact DevKit firmware selected after applying the compatibility policy.
        value: ${{ jobs.resolve.outputs.devkit_firmware }}
      compatibility_policy_sha256:
        description: SHA256 of the canonical compatibility policy bundled with this workflow.
        value: ${{ jobs.resolve.outputs.compatibility_policy_sha256 }}
      version_fallback:
        description: Whether the firmware label was explicitly dropped.
        value: ${{ jobs.resolve.outputs.version_fallback }}
      platform_version:
        description: Platform version read from the dependency manifest.
        value: ${{ jobs.resolve.outputs.platform_version }}
      modalix_runner_group:
        description: Modalix runner group resolved from the platform version.
        value: ${{ jobs.resolve.outputs.modalix_runner_group }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    name: Resolve Modalix runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCOVERY_APP_ID: ${{ secrets.app_id }}
    outputs:
      runner_labels: ${{ steps.runner.outputs.runner_labels }}
      elxr_version: ${{ steps.runner.outputs.elxr_version }}
      devkit_firmware: ${{ steps.runner.outputs.devkit_firmware }}
      compatibility_policy_sha256: ${{ steps.runner.outputs.compatibility_policy_sha256 }}
      version_fallback: ${{ steps.runner.outputs.version_fallback }}
      platform_version: ${{ steps.runner.outputs.platform_version }}
      modalix_runner_group: ${{ steps.runner.outputs.modalix_runner_group }}
    steps:
      - name: Checkout dependency manifest
        if: ${{ inputs.manifest_artifact == '' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          path: caller
          persist-credentials: false
      - name: Download resolved dependency manifest
        if: ${{ inputs.manifest_artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.manifest_artifact }}
          path: caller
      - name: Inspect firmware selection
        id: manifest
        env:
          MANIFEST_PATH: caller/${{ inputs.manifest_path }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          manifest = json.loads(Path(os.environ['MANIFEST_PATH']).read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"versioned={'true' if 'elxr_version' in manifest else 'false'}\n")
          PYTHON

      - name: Mint runner discovery token
        if: ${{ steps.manifest.outputs.versioned == 'true' && env.DISCOVERY_APP_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: read

      - name: Resolve Modalix runner group
        id: runner
        shell: bash
        env:
          MANIFEST_PATH: caller/${{ inputs.manifest_path }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          RUNNER_LABELS: ${{ inputs.runner-labels }}
          ALLOW_VERSION_FALLBACK: ${{ inputs.allow-version-fallback }}
          RUNNER_DISCOVERY_TOKEN: ${{ steps.app-token.outputs.token || secrets.RUNNER_DISCOVERY_TOKEN }}
          LEGACY_PLATFORM_VERSION: ${{ inputs.legacy_platform_version }}
          LEGACY_RUNNER_GROUP: ${{ inputs.legacy_runner_group }}
          VERSIONED_RUNNER_GROUP_PREFIX: ${{ inputs.versioned_runner_group_prefix }}
        run: |
          # BEGIN BUNDLED MODALIX RESOLVER
          python3 - <<'PYTHON'
          #!/usr/bin/env python3
          """Resolve an eligible runner group and exact firmware labels, never change devices."""
          import hashlib
          import json
          import os
          import re
          import sys
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen


          # Replaced with the reviewed JSON literal when bundled into the pinned workflow.
          COMPATIBILITY_POLICY = json.loads('{\n  "schema_version": 1,\n  "mappings": [\n    {\n      "sdk_base": "3.0.0_master_B2499",\n      "devkit_firmware": "3.0.0_master_B2501",\n      "reason": "Approved equivalent platform builds; use published B2499 sysroot with B2501 DevKits."\n    }\n  ]\n}\n')


          def compatibility_target(version, policy):
              if not isinstance(policy, dict) or type(policy.get('schema_version')) is not int or policy['schema_version'] != 1:
                  raise ValueError('Unsupported platform compatibility policy schema')
              entries = policy.get('mappings')
              if not isinstance(entries, list):
                  raise ValueError('Compatibility mappings must be a list')
              targets = {}
              identity = r'(\d+\.\d+\.\d+)_(master|develop)_B[1-9]\d*'
              for entry in entries:
                  if not isinstance(entry, dict):
                      raise ValueError('Invalid compatibility mapping')
                  source, target = entry.get('sdk_base'), entry.get('devkit_firmware')
                  source_id = re.fullmatch(identity, source) if isinstance(source, str) else None
                  target_id = re.fullmatch(identity, target) if isinstance(target, str) else None
                  if not source_id or not target_id or source_id.groups() != target_id.groups():
                      raise ValueError('Compatibility mapping must use valid identities from the same platform and channel')
                  if source in targets:
                      raise ValueError(f'Duplicate compatibility mapping for {source}')
                  if not isinstance(entry.get('reason'), str) or not entry['reason'].strip():
                      raise ValueError('Compatibility mapping requires a reason')
                  targets[source] = target
              # Deliberately one lookup: mappings are directional, never transitive.
              return targets.get(version, version)


          def compatibility_policy_sha256():
              canonical = json.dumps(COMPATIBILITY_POLICY, sort_keys=True, separators=(',', ':')).encode()
              return hashlib.sha256(canonical).hexdigest()


          def collect(get, path, key):
              items = []
              for page in range(1, 1001):
                  response = get(f'{path}?per_page=100&page={page}')
                  batch = response[key]
                  if not isinstance(batch, list):
                      raise ValueError(f'Invalid runner inventory response: {key}')
                  items.extend(batch)
                  if len(batch) < 100:
                      return items
              raise ValueError('Runner inventory pagination exceeded limit')


          def select(runners, labels, version, allow_fallback):
              required = {label.casefold() for label in labels}
              eligible = [r for r in runners if r['status'] == 'online' and required.issubset(
                  {label['name'].casefold() for label in r['labels']})]
              # Busy runners still qualify: wait for the exact firmware instead of downgrading.
              exact = [r for r in eligible if version.casefold() in
                       {label['name'].casefold() for label in r['labels']}]
              if exact:
                  return labels + [version], False, exact
              if not allow_fallback:
                  raise ValueError(f'No online runner matches firmware {version} and all requested labels')
              if not eligible:
                  raise ValueError('No online runner matches the required hardware/environment labels')
              return labels, True, eligible


          def resolve(manifest, labels, get, repository, *, allow_fallback=False,
                      repository_private=True, legacy_version='2.0.0', legacy_group='modalix-devkit', prefix='modalix-devkit-'):
              platform = str(manifest.get('platform-version', '')).strip()
              if not isinstance(platform, str) or not re.fullmatch(r'[0-9][0-9A-Za-z._+-]*', platform):
                  raise ValueError('Missing or invalid platform-version')
              legacy_version, legacy_group, prefix = (value.strip() for value in (legacy_version, legacy_group, prefix))
              if not legacy_version or not legacy_group or not prefix:
                  raise ValueError('Legacy platform version, runner group and prefix must not be empty')
              if not isinstance(labels, list) or not labels or any(
                  not isinstance(label, str) or not label.strip() or '\n' in label for label in labels
              ):
                  raise ValueError('runner-labels must be a nonempty JSON array of label strings')
              if any(re.fullmatch(r'\d+\.\d+\.\d+_(master|develop)_B\d+', label) for label in labels):
                  raise ValueError('Firmware labels must come from manifest elxr_version')
              group = legacy_group if platform == legacy_version else prefix + platform
              result = dict(platform_version=platform, modalix_runner_group=group,
                            runner_labels=labels, elxr_version='', version_fallback=False,
                            candidate_runners=[], devkit_firmware='',
                            compatibility_policy_sha256=compatibility_policy_sha256())
              # Preserve older callers that have not adopted the firmware manifest field.
              if 'elxr_version' not in manifest:
                  return result
              version = manifest['elxr_version']
              if not isinstance(version, str) or not re.fullmatch(r'\d+\.\d+\.\d+_(master|develop)_B[1-9]\d*', version):
                  raise ValueError('Invalid elxr_version; expected 3.0.0_master_B2263 or a develop build')
              if version.split('_', 1)[0] != platform:
                  raise ValueError('elxr_version does not match platform-version')
              devkit_firmware = compatibility_target(version, COMPATIBILITY_POLICY)
              owner = quote(repository.split('/')[0], safe='')
              base = f'/orgs/{owner}/actions/runner-groups'
              groups = [g for g in collect(get, base, 'runner_groups') if g['name'] == group]
              if len(groups) != 1:
                  raise ValueError(f'Expected one accessible runner group named {group}')
              selected = groups[0]
              # Check repository access before treating a group member as schedulable.
              if not repository_private and not selected.get('allows_public_repositories', False):
                  raise ValueError(f'Runner group {group} does not allow public repositories')
              if selected['visibility'] == 'selected':
                  repos = collect(get, f'{base}/{selected["id"]}/repositories', 'repositories')
                  if not any(r['full_name'].casefold() == repository.casefold() for r in repos):
                      raise ValueError(f'Repository {repository} has no access to runner group {group}')
              runners = collect(get, f'{base}/{selected["id"]}/runners', 'runners')
              resolved_labels, fallback, candidates = select(runners, labels, devkit_firmware, allow_fallback)
              result.update(runner_labels=resolved_labels, elxr_version=version, devkit_firmware=devkit_firmware,
                            version_fallback=fallback, candidate_runners=[r['name'] for r in candidates])
              return result


          def main():
              token = os.environ.get('RUNNER_DISCOVERY_TOKEN', '')
              api = os.environ.get('GITHUB_API_URL', 'https://api.github.com').rstrip('/')

              def get(path):
                  if not token:
                      raise ValueError('Configure App credentials (app_id/app_private_key) with organization self-hosted-runners read access, or RUNNER_DISCOVERY_TOKEN')
                  request = Request(api + path, headers={
                      'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28'})
                  try:
                      with urlopen(request, timeout=30) as response:
                          return json.load(response)
                  except HTTPError as error:
                      raise ValueError(f'Runner discovery API {path.split('?')[0]} returned HTTP {error.code}; check token permissions and group access') from None

              result = resolve(
                  json.loads(Path(os.environ['MANIFEST_PATH']).read_text()),
                  json.loads(os.environ['RUNNER_LABELS']), get, os.environ['GITHUB_REPOSITORY'],
                  allow_fallback=os.environ.get('ALLOW_VERSION_FALLBACK', 'false') == 'true',
                  repository_private=json.loads(os.environ.get('REPOSITORY_PRIVATE') or 'true'),
                  legacy_version=os.environ['LEGACY_PLATFORM_VERSION'],
                  legacy_group=os.environ['LEGACY_RUNNER_GROUP'], prefix=os.environ['VERSIONED_RUNNER_GROUP_PREFIX'])
              Path('runner-resolution.json').write_text(json.dumps(result, indent=2) + '\n')
              print(json.dumps(result, indent=2))
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  for key, value in result.items():
                      output.write(f'{key}={value if isinstance(value, str) else json.dumps(value)}\n')
              if result['version_fallback']:
                  print('::warning::No eligible exact firmware match; explicitly allowed version fallback is active')


          if __name__ == '__main__':
              try:
                  main()
              except (ValueError, KeyError, OSError) as error:
                  print(f'Runner resolution failed: {error}', file=sys.stderr)
                  sys.exit(1)
          PYTHON
          # END BUNDLED MODALIX RESOLVER
      - uses: actions/upload-artifact@v4
        with:
          name: runner-resolution
          path: runner-resolution.json
          if-no-files-found: error
          overwrite: true
