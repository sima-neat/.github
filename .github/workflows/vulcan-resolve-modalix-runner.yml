name: Vulcan Resolve Modalix Runner

on:
  workflow_call:
    inputs:
      manifest_path:
        description: Path to the dependency manifest in the caller repository.
        required: false
        default: deps/manifest.json
        type: string
      allow-version-fallback:
        description: Allow dropping only the firmware label when no online exact match exists.
        type: boolean
        default: false
      runner-labels:
        description: JSON array of all required hardware and environment labels.
        type: string
        default: '["self-hosted", "Linux", "ARM64", "modalix"]'
      shared_workflow_ref:
        description: Ref containing the resolver script; use the same ref as this workflow.
        type: string
        default: main
      legacy_platform_version:
        description: Platform version that uses the legacy Modalix runner group.
        required: false
        default: 2.0.0
        type: string
      legacy_runner_group:
        description: Runner group used for the legacy platform version.
        required: false
        default: modalix-devkit
        type: string
      versioned_runner_group_prefix:
        description: Prefix for versioned Modalix runner groups.
        required: false
        default: modalix-devkit-
        type: string
    secrets:
      app_id:
        description: Existing GitHub App ID for runner discovery.
        required: false
      app_private_key:
        description: Existing GitHub App private key for runner discovery.
        required: false
      RUNNER_DISCOVERY_TOKEN:
        description: Token with organization self-hosted-runners read access; required for elxr_version.
        required: false
    outputs:
      runner_labels:
        description: JSON array of resolved labels, including exact firmware unless fallback was used.
        value: ${{ jobs.resolve.outputs.runner_labels }}
      elxr_version:
        description: Requested firmware identity.
        value: ${{ jobs.resolve.outputs.elxr_version }}
      version_fallback:
        description: Whether the firmware label was explicitly dropped.
        value: ${{ jobs.resolve.outputs.version_fallback }}
      platform_version:
        description: Platform version read from the dependency manifest.
        value: ${{ jobs.resolve.outputs.platform_version }}
      modalix_runner_group:
        description: Modalix runner group resolved from the platform version.
        value: ${{ jobs.resolve.outputs.modalix_runner_group }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    name: Resolve Modalix runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCOVERY_APP_ID: ${{ secrets.app_id }}
    outputs:
      runner_labels: ${{ steps.runner.outputs.runner_labels }}
      elxr_version: ${{ steps.runner.outputs.elxr_version }}
      version_fallback: ${{ steps.runner.outputs.version_fallback }}
      platform_version: ${{ steps.runner.outputs.platform_version }}
      modalix_runner_group: ${{ steps.runner.outputs.modalix_runner_group }}
    steps:
      - name: Checkout dependency manifest
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          path: caller
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: sima-neat/.github
          ref: ${{ inputs.shared_workflow_ref }}
          path: shared
          persist-credentials: false

      - name: Mint runner discovery token
        if: ${{ env.DISCOVERY_APP_ID != '' }}
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          permission-organization-self-hosted-runners: read

      - name: Resolve Modalix runner group
        id: runner
        shell: bash
        env:
          MANIFEST_PATH: caller/${{ inputs.manifest_path }}
          RUNNER_LABELS: ${{ inputs.runner-labels }}
          ALLOW_VERSION_FALLBACK: ${{ inputs.allow-version-fallback }}
          RUNNER_DISCOVERY_TOKEN: ${{ steps.app-token.outputs.token || secrets.RUNNER_DISCOVERY_TOKEN }}
          LEGACY_PLATFORM_VERSION: ${{ inputs.legacy_platform_version }}
          LEGACY_RUNNER_GROUP: ${{ inputs.legacy_runner_group }}
          VERSIONED_RUNNER_GROUP_PREFIX: ${{ inputs.versioned_runner_group_prefix }}
        run: python3 shared/scripts/resolve_modalix_runner.py
      - uses: actions/upload-artifact@v4
        with:
          name: runner-resolution
          path: runner-resolution.json
          if-no-files-found: error
          overwrite: true
